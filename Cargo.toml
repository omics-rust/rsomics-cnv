[package]
name = "rsomics-cnv"
version = "0.1.0"
description = "BAF and LRR copy-number analysis workflows"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-cnv"
homepage = "https://github.com/omics-rust/rsomics-cnv"
documentation = "https://docs.rs/rsomics-cnv"
authors = ["Zane Leong <efd@live.com>"]
categories = ["science", "command-line-utilities"]
keywords = ["bioinformatics", "cnv", "genomics", "vcf", "bcf"]
readme = "README.md"

[lib]
doctest = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libm = "0.2"
levenberg-marquardt = { version = "0.15", features = ["minpack-compat"] }
nalgebra = "0.34"
noodles-bcf = "0.88"
noodles-vcf = "0.90"
rsomics-common = "0.12"
rsomics-help = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
noodles-bgzf = "0.49"
